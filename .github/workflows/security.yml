name: Security Scan - Face-Attend

on:
  push:
    branches: [main, master, testing]
  pull_request:
    branches: [main, master, testing]
  schedule:
    - cron: '0 8 * * 1'  # otomatis scan setiap Senin jam 8 pagi

jobs:
  # ─── Scan celah keamanan di dependencies Python ────
  dependency-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Scan dengan pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt || true

  # ─── Scan secrets & credentials yang bocor ─────────
  secret-scan:
    name: Secret leak scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # perlu full history untuk scan semua commit

      - name: Scan dengan Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── Scan celah di kode Python (SAST) ──────────────
  code-scan:
    name: Static code analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Scan dengan Bandit
        run: |
          pip install bandit
          bandit -r . \
            --exclude ./.git,./venv,./env \
            -ll \
            --format txt || true
