name: CI - Face-Attend

on:
  push:
    branches: [main, master, testing]
  pull_request:
    branches: [main, master, testing]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system deps (OpenCV, dlib)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libgl1 \
            libglib2.0-0 \
            libsm6 libxrender1 libxext6 \
            cmake libboost-all-dev

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt  # ← tambah ini

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Check imports & syntax
        run: |
          python -c "import fastapi; print('FastAPI OK')"
          python -c "import cv2; print('OpenCV OK')"
          python -c "import deepface; print('DeepFace OK')"
          python -c "import sqlalchemy; print('SQLAlchemy OK')"

      - name: Lint dengan flake8
        run: |
          pip install flake8
          flake8 backend/ --count --max-line-length=120 \
            --exclude=.git,__pycache__,venv \
            --per-file-ignores="__init__.py:F401" \
            --statistics || true

      - name: Run tests
        run: |
          pip install pytest httpx
          cd backend
          PYTHONPATH=. pytest tests/ -v --tb=short  # ← tambah --tb=short
