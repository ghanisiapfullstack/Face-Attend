name: CI - Test & Lint

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ─── Test Python backend ───────────────────────────
  test-python:
    name: Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests (kalau ada folder tests/)
        run: |
          if [ -d "tests" ]; then
            python -m pytest tests/ -v
          else
            echo "Belum ada folder tests, skip"
          fi

      - name: Check syntax Python
        run: python -m py_compile app.py || python -m py_compile main.py || echo "Entry point tidak ditemukan, skip"

  # ─── Test / lint JavaScript & HTML ─────────────────
  test-frontend:
    name: Frontend check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
        if: hashFiles('package.json') != ''

      - name: Install JS dependencies
        if: hashFiles('package.json') != ''
        run: npm ci

      - name: Run JS tests
        if: hashFiles('package.json') != ''
        run: npm test --if-present

      - name: Validate HTML files
        run: |
          echo "HTML files found:"
          find . -name "*.html" -not -path "./.git/*"
          echo "Frontend check selesai"
